server:
  port: 9999

spring:
  application:
    name: spring-ai-demo

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai
    username: springai
    password: ${DB_PASSWORD:springai123}
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
      embedding:
        options:
          model: nomic-embed-text

app:
  project-index:
    storage-dir: "D:/my-download-app/Spring-AI-Projects/analyticData/project-index"


