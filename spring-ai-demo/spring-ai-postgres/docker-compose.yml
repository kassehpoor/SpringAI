services:

  postgres:
    image: pgvector/pgvector:pg18
    container_name: spring-ai-postgres

    environment:
      POSTGRES_DB: spring_ai
      POSTGRES_USER: springai
      POSTGRES_PASSWORD: springai123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: